<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d372e" />
      <stop offset="40%" stop-color="#4f4940" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="750" fill="url(#bgLight)" />

  <!-- Campus Silhouette Overlay in Background -->
  <g opacity="0.35">
    <!-- Brick buildings, stone arches & trees silhouette -->
    <rect x="0" y="70" width="1200" height="380" fill="#2d2a24" />
    <path d="M 0 120 L 140 80 L 260 120 L 260 450 L 0 450 Z" fill="#3a342c" />
    <path d="M 940 120 L 1060 80 L 1200 120 L 1200 450 L 940 450 Z" fill="#3a342c" />
    <!-- Arched windows -->
    <rect x="30" y="180" width="80" height="140" rx="40" fill="#1e1b17" opacity="0.6" />
    <rect x="1090" y="180" width="80" height="140" rx="40" fill="#1e1b17" opacity="0.6" />
  </g>

  <!-- ================= TOP NAVBAR ================= -->
  <rect x="0" y="0" width="1200" height="74" fill="#121315" />
  
  <!-- University Logo Badge -->
  <g transform="translate(48, 11)">
    <rect width="52" height="52" rx="6" fill="#ffffff" />
    <!-- Crest details -->
    <circle cx="26" cy="22" r="16" fill="#0284c7" />
    <circle cx="26" cy="22" r="14" fill="#ffffff" />
    <path d="M 16 22 L 36 22 M 26 12 L 26 32" stroke="#dc2626" stroke-width="2" />
    <circle cx="26" cy="22" r="5" fill="#f59e0b" />
    <text x="26" y="44" font-family="'Inter', sans-serif" font-size="5.5" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="0.2">UNIVERSITY OF</text>
    <text x="26" y="49" font-family="'Inter', sans-serif" font-size="5.5" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="0.2">MPUMALANGA</text>
  </g>

  <!-- Society Title in Navbar -->
  <text x="114" y="36" font-family="'Georgia', serif" font-size="19" font-weight="700" fill="#ffffff">University Student Society</text>
  <text x="114" y="53" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#c5a059" letter-spacing="1">UNIVERSITY OF MPUMALANGA • SCENARIO 8</text>

  <!-- Nav Links -->
  <g transform="translate(460, 42)" font-family="'Inter', sans-serif" font-size="13" font-weight="600">
    <!-- HOME (active with gold underline) -->
    <text x="0" y="0" fill="#ffffff">HOME</text>
    <rect x="-2" y="7" width="46" height="2.5" fill="#c5a059" />

    <text x="75" y="0" fill="#d1d5db">ABOUT</text>
    <text x="155" y="0" fill="#d1d5db">REGISTER</text>
    <text x="250" y="0" fill="#d1d5db">CONTACT</text>
    <text x="345" y="0" fill="#d1d5db">PRIVACY</text>
    <text x="435" y="0" fill="#d1d5db">POPIA</text>

    <!-- ADMIN LOGIN Button -->
    <rect x="505" y="-18" width="124" height="34" rx="4" fill="none" stroke="#c5a059" stroke-width="1.2" />
    <text x="567" y="4" font-size="11.5" font-weight="700" fill="#c5a059" text-anchor="middle" letter-spacing="0.5">ADMIN LOGIN</text>
  </g>

  <!-- ================= HERO OVERLAY CARD ================= -->
  <g transform="translate(120, 115)" filter="url(#cardShadow)">
    <!-- Dark Card Background with subtle border -->
    <rect width="960" height="375" rx="8" fill="#161719" opacity="0.95" />
    <rect width="960" height="375" rx="8" fill="none" stroke="#37352f" stroke-width="1" />

    <!-- Top Badge Pill -->
    <g transform="translate(325, 45)">
      <rect width="310" height="28" rx="4" fill="none" stroke="#c5a059" stroke-width="1" />
      <text x="155" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#c5a059" text-anchor="middle" letter-spacing="1">
        UNIVERSITY STUDENT SOCIETY • SCENARIO 8
      </text>
    </g>

    <!-- Headline -->
    <text x="480" y="132" font-family="'Georgia', serif" font-size="39" font-weight="700" fill="#ffffff" text-anchor="middle">
      Student Society Membership System
    </text>

    <!-- Subtitle description paragraph (wrapped) -->
    <text x="480" y="172" font-family="'Inter', sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle" font-weight="400">
      Welcome to the official membership platform for the University Student Society. Connect with like-
    </text>
    <text x="480" y="196" font-family="'Inter', sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle" font-weight="400">
      minded peers, attend hands-on workshops, participate in vibrant activities, and build leadership skills for
    </text>
    <text x="480" y="220" font-family="'Inter', sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle" font-weight="400">
      your academic and professional journey.
    </text>

    <!-- CTA Buttons -->
    <g transform="translate(315, 260)">
      <!-- REGISTER NOW (Gold Solid) -->
      <rect width="165" height="46" rx="4" fill="#a88144" />
      <text x="82.5" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        REGISTER NOW
      </text>

      <!-- LEARN MORE ABOUT US (Dark Outline) -->
      <rect x="180" y="0" width="200" height="46" rx="4" fill="#1b1c1e" stroke="#3b3b38" stroke-width="1" />
      <text x="280" y="28" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        LEARN MORE ABOUT US
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM SECTION: WHY JOIN ================= -->
  <g transform="translate(0, 520)">
    <!-- Heading -->
    <text x="600" y="32" font-family="'Georgia', serif" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">
      Why Join Our Student Society?
    </text>
    <text x="600" y="58" font-family="'Inter', sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
      Our student society provides an enriching, supportive environment where academic learning meets real-world leadership and community fellowship.
    </text>

    <!-- 3 Cards Grid -->
    <!-- Card 1 -->
    <g transform="translate(120, 85)" filter="url(#subtleShadow)">
      <rect width="300" height="120" rx="6" fill="#ffffff" stroke="#e5e7eb" />
      <text x="24" y="36" font-family="'Georgia', serif" font-size="18" font-weight="700" fill="#111827">Professional Growth</text>
      <line x1="24" y1="50" x2="276" y2="50" stroke="#f3f4f6" stroke-width="1.5" />
      <text x="24" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">Access exclusive seminars, coding</text>
      <text x="24" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">hackathons, and industry networking.</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(450, 85)" filter="url(#subtleShadow)">
      <rect width="300" height="120" rx="6" fill="#ffffff" stroke="#e5e7eb" />
      <text x="24" y="36" font-family="'Georgia', serif" font-size="18" font-weight="700" fill="#111827">Community &amp; Fellowship</text>
      <line x1="24" y1="50" x2="276" y2="50" stroke="#f3f4f6" stroke-width="1.5" />
      <text x="24" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">Forge lasting friendships through annual</text>
      <text x="24" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">social events, retreats, and campus life.</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(780, 85)" filter="url(#subtleShadow)">
      <rect width="300" height="120" rx="6" fill="#ffffff" stroke="#e5e7eb" />
      <text x="24" y="36" font-family="'Georgia', serif" font-size="18" font-weight="700" fill="#111827">Executive Leadership</text>
      <line x1="24" y1="50" x2="276" y2="50" stroke="#f3f4f6" stroke-width="1.5" />
      <text x="24" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">Step forward to run committees,</text>
      <text x="24" y="93" font-family="'Inter', sans-serif" font-size="12" fill="#6b7280">organize student rallies, and lead.</text>
    </g>
  </g>
</svg>
