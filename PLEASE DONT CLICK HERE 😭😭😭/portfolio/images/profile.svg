<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#151e34" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2c4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 210, 196, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>

  <!-- Outer Ring with Glow -->
  <circle cx="300" cy="270" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="10 8" filter="url(#glow)" opacity="0.8" />
  <circle cx="300" cy="270" r="140" fill="url(#circleGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Avatar Silhouette / Monogram -->
  <g fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round">
    <!-- Stylized Developer Head & Shoulders -->
    <circle cx="300" cy="230" r="55" fill="#151e34" stroke="url(#cyanGrad)" stroke-width="3.5" />
    <path d="M 215 350 C 220 295, 380 295, 385 350" fill="#151e34" stroke="url(#cyanGrad)" stroke-width="3.5" />
  </g>

  <!-- Monogram Initials overlay -->
  <text x="300" y="242" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#00d2c4" text-anchor="middle">TL</text>

  <!-- Code brackets -->
  <text x="175" y="275" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="700" fill="#00d2c4" opacity="0.5">&lt;</text>
  <text x="425" y="275" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="700" fill="#00d2c4" opacity="0.5">&gt;</text>

  <!-- Badge Pill at Bottom -->
  <g transform="translate(150, 480)">
    <rect width="300" height="54" rx="27" fill="#151e34" stroke="#00d2c4" stroke-width="1.5" />
    <text x="150" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle">
      Tshepiso Letelo • ICT Student
    </text>
  </g>
</svg>
